# ============================================================
# ReyHomes — Production Blueprint (Fast API + Budget)
# Total ≈ $38/month (Pro workspace $25 + Starter $7 + Basic-256mb $6)
# ============================================================

databases:
  - name: reyhomes-db
    plan: basic-256mb
    databaseName: reyhomes
    user: reyhomes

services:
  - type: web
    name: reyhomes-backend
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      (python manage.py createsuperuser --noinput || true) &&
      python manage.py seed_if_empty

    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --worker-class gthread --timeout 30 --keep-alive 5

    envVars:
      # =========================
      # DJANGO ADMIN
      # (Fill these in Render Dashboard)
      # =========================
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # =========================
      # CORE DJANGO
      # =========================
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"

      # =========================
      # DATABASE
      # =========================
      - key: DATABASE_URL
        fromDatabase:
          name: reyhomes-db
          property: connectionString

      # =========================
      # HOST / CORS / CSRF
      # Update after custom domain is live
      # =========================
      - key: ALLOWED_HOSTS
        value: "reyhomes-backend.onrender.com,api.reyhomes.com.au"
      - key: FRONTEND_URL
        value: "https://reyhomes.com.au"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://reyhomes.com.au,https://www.reyhomes.com.au"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://api.reyhomes.com.au,https://reyhomes.com.au,https://www.reyhomes.com.au,https://reyhomes-backend.onrender.com"

      # =========================
      # SECURITY
      # =========================
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

      # =========================
      # JWT
      # =========================
      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "14"

      # =========================
      # MEDIA (Cloudinary)
      # =========================
      - key: USE_CLOUDINARY
        value: "True"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # =========================
      # S3 / R2 (disabled)
      # =========================
      - key: USE_S3
        value: "False"
