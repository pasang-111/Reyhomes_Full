# render.yaml — ReyHomes (Persistent Disk)
databases:
  - name: reyhomes-db
    plan: basic-256mb
    region: singapore
    databaseName: reyhomes
    user: reyhomes

services:
  - type: web
    name: reyhomes-backend
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend

    disk:
      name: reyhomes-media
      mountPath: /var/data
      sizeGB: 5

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      (python manage.py createsuperuser --noinput || true)

    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --worker-class gthread --timeout 30 --keep-alive 5

    envVars:
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_SQLITE
        value: "False"

      - key: DB_NAME
        fromDatabase:
          name: reyhomes-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: reyhomes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: reyhomes-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: reyhomes-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: reyhomes-db
          property: port

      - key: ALLOWED_HOSTS
        value: "reyhomes-backend.onrender.com,api.reyhomes.com.au"
      - key: FRONTEND_URL
        value: "https://reyhomes.com.au"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://reyhomes.com.au,https://www.reyhomes.com.au"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://api.reyhomes.com.au,https://reyhomes.com.au,https://www.reyhomes.com.au,https://reyhomes-backend.onrender.com"

      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

      - key: JWT_ACCESS_MINUTES
        value: "30"
      - key: JWT_REFRESH_DAYS
        value: "14"

      - key: USE_CLOUDINARY
        value: "False"
      - key: USE_S3
        value: "False"
      - key: MEDIA_ROOT
        value: "/var/data/media"
