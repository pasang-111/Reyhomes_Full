databases:
  - name: reyhomes-db
    plan: free
    databaseName: reyhomes
    user: reyhomes

services:
  - type: web
    name: reyhomes-backend
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && (python manage.py createsuperuser --noinput || true) && python manage.py seed_if_empty"

    startCommand: "gunicorn config.wsgi:application"

    envVars:
      # =========================
      # DJANGO ADMIN
      # =========================
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false

      - key: DJANGO_SUPERUSER_EMAIL
        sync: false

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # =========================
      # DJANGO SETTINGS
      # =========================
      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: USE_SQLITE
        value: "False"

      # =========================
      # HOST / CORS / CSRF
      # =========================
      - key: ALLOWED_HOSTS
        value: "reyhomes-backend-wk9r.onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://reyhomes-yc57.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://reyhomes-backend-wk9r.onrender.com,https://reyhomes-yc57.vercel.app"

      # =========================
      # POSTGRES DATABASE
      # =========================
      - key: DB_NAME
        fromDatabase:
          name: reyhomes-db
          property: database

      - key: DB_USER
        fromDatabase:
          name: reyhomes-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: reyhomes-db
          property: password

      - key: DB_HOST
        fromDatabase:
          name: reyhomes-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: reyhomes-db
          property: port

      # =========================
      # SECURITY
      # =========================
      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SESSION_COOKIE_SECURE
        value: "True"

      - key: CSRF_COOKIE_SECURE
        value: "True"

      # =========================
      # JWT
      # =========================
      - key: JWT_ACCESS_MINUTES
        value: "30"

      - key: JWT_REFRESH_DAYS
        value: "14"

      # =========================
      # CLOUDINARY MEDIA
      # =========================
      - key: USE_CLOUDINARY
        value: "True"

      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false

      # =========================
      # S3 / R2 - OPTIONAL
      # =========================
      - key: USE_S3
        value: "False"

      - key: AWS_ACCESS_KEY_ID
        sync: false

      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      - key: AWS_STORAGE_BUCKET_NAME
        sync: false

      - key: AWS_S3_REGION_NAME
        sync: false

      - key: AWS_S3_ENDPOINT_URL
        sync: false

      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

      # =========================
      # UNSPLASH - OPTIONAL
      # =========================
      - key: UNSPLASH_ACCESS_KEY
        sync: false
