<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#0B0B0C"/>
  <text x="40" y="50" fill="#D8C7A4" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">STEP 5 · RECOMMENDED</text>
  <text x="40" y="90" fill="#F5F0E6" font-family="system-ui,sans-serif" font-size="26" font-weight="600">Cloudflare R2 — media that survives redeploys</text>
  <text x="40" y="125" fill="#888" font-family="system-ui,sans-serif" font-size="14">Render free has no persistent disk. Without R2, uploads vanish on every redeploy.</text>
  <!-- steps -->
  <g font-family="system-ui,sans-serif">
    <rect x="40" y="160" width="250" height="140" rx="12" fill="#16161a" stroke="#333"/>
    <text x="60" y="195" fill="#D8C7A4" font-size="13">A. Cloudflare</text>
    <text x="60" y="225" fill="#fff" font-size="13">R2 → Create bucket</text>
    <text x="60" y="250" fill="#aaa" font-size="12">reyhomes-media</text>
    <text x="60" y="275" fill="#aaa" font-size="12">Enable public r2.dev URL</text>
    
    <rect x="310" y="160" width="250" height="140" rx="12" fill="#16161a" stroke="#333"/>
    <text x="330" y="195" fill="#D8C7A4" font-size="13">B. API token</text>
    <text x="330" y="225" fill="#fff" font-size="13">Object Read &amp; Write</text>
    <text x="330" y="250" fill="#aaa" font-size="12">Copy Access Key ID</text>
    <text x="330" y="275" fill="#aaa" font-size="12">Copy Secret Access Key</text>
    
    <rect x="580" y="160" width="280" height="140" rx="12" fill="#16161a" stroke="#8C1D2C"/>
    <text x="600" y="195" fill="#D8C7A4" font-size="13">C. Render env</text>
    <text x="600" y="225" fill="#fff" font-size="12">USE_S3=True</text>
    <text x="600" y="248" fill="#aaa" font-size="11">AWS_* keys + bucket</text>
    <text x="600" y="270" fill="#aaa" font-size="11">ENDPOINT + CUSTOM_DOMAIN</text>
  </g>
  <rect x="40" y="330" width="820" height="180" rx="12" fill="#13243B" stroke="#333"/>
  <text x="60" y="370" fill="#D8C7A4" font-family="system-ui,sans-serif" font-size="13">Example values</text>
  <text x="60" y="405" fill="#ccc" font-family="ui-monospace,monospace" font-size="12">AWS_S3_ENDPOINT_URL = https://ACCOUNT_ID.r2.cloudflarestorage.com</text>
  <text x="60" y="435" fill="#ccc" font-family="ui-monospace,monospace" font-size="12">AWS_S3_CUSTOM_DOMAIN = pub-xxxxx.r2.dev   ← no https://</text>
  <text x="60" y="475" fill="#3fb950" font-family="system-ui,sans-serif" font-size="13">Redeploy → Admin upload image → public page should load from R2</text>
</svg>
