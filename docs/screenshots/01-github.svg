<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="#0d1117"/>
  <rect x="0" y="0" width="900" height="48" fill="#161b22"/>
  <circle cx="28" cy="24" r="8" fill="#f85149"/>
  <circle cx="52" cy="24" r="8" fill="#d29922"/>
  <circle cx="76" cy="24" r="8" fill="#3fb950"/>
  <text x="110" y="30" fill="#8b949e" font-family="system-ui,sans-serif" font-size="14">github.com · New repository</text>
  <text x="40" y="100" fill="#D8C7A4" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">STEP 1</text>
  <text x="40" y="140" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="28" font-weight="600">Push code to GitHub</text>
  <rect x="40" y="170" width="820" height="280" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="210" fill="#8b949e" font-family="ui-monospace,monospace" font-size="14">$ cd reyhomes_new</text>
  <text x="60" y="240" fill="#8b949e" font-family="ui-monospace,monospace" font-size="14">$ git init &amp;&amp; git add . &amp;&amp; git commit -m "ReyHomes free deploy"</text>
  <text x="60" y="270" fill="#8b949e" font-family="ui-monospace,monospace" font-size="14">$ git branch -M main</text>
  <text x="60" y="300" fill="#8b949e" font-family="ui-monospace,monospace" font-size="14">$ git remote add origin https://github.com/YOU/reyhomes.git</text>
  <text x="60" y="330" fill="#3fb950" font-family="ui-monospace,monospace" font-size="14">$ git push -u origin main</text>
  <text x="60" y="390" fill="#f0f6fc" font-family="system-ui,sans-serif" font-size="14">✓ Repo is public or private — both work with Render &amp; Vercel</text>
  <text x="60" y="420" fill="#8b949e" font-family="system-ui,sans-serif" font-size="13">Do not commit .env files with real secrets</text>
</svg>
