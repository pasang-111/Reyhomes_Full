  <text x="80" y="265" fill="#fff" font-family="system-ui,sans-serif" font-size="14">reyhomes-db</text>
  <rect x="60" y="290" width="360" height="56" rx="8" fill="#222" stroke="#3fb950"/>
  <text x="80" y="315" fill="#3fb950" font-family="system-ui,sans-serif" font-size="12">● Web service free</text>
  <text x="80" y="335" fill="#fff" font-family="system-ui,sans-serif" font-size="14">reyhomes-backend · rootDir: backend</text>
  <rect x="60" y="370" width="360" height="80" rx="8" fill="#2a1a1a" stroke="#8C1D2C"/>
  <text x="80" y="400" fill="#D8C7A4" font-family="system-ui,sans-serif" font-size="12">Set before Apply (sync: false)</text>
  <text x="80" y="425" fill="#fff" font-family="system-ui,sans-serif" font-size="12">DJANGO_SUPERUSER_USERNAME / EMAIL / PASSWORD</text>
  <!-- right callouts -->
  <rect x="470" y="160" width="390" height="320" rx="12" fill="#1A1A1E" stroke="#333"/>
  <text x="490" y="200" fill="#D8C7A4" font-family="system-ui,sans-serif" font-size="14">After Live → Environment</text>
  <text x="490" y="240" fill="#fff" font-family="system-ui,sans-serif" font-size="13">ALLOWED_HOSTS</text>
  <text x="490" y="260" fill="#888" font-family="ui-monospace,monospace" font-size="12">reyhomes-backend.onrender.com</text>
  <text x="490" y="300" fill="#fff" font-family="system-ui,sans-serif" font-size="13">CSRF_TRUSTED_ORIGINS</text>
  <text x="490" y="320" fill="#888" font-family="ui-monospace,monospace" font-size="12">https://reyhomes-backend.onrender.com</text>
  <text x="490" y="370" fill="#3fb950" font-family="system-ui,sans-serif" font-size="14">Then open:</text>
  <text x="490" y="400" fill="#D8C7A4" font-family="ui-monospace,monospace" font-size="13">https://…onrender.com/admin/</text>
