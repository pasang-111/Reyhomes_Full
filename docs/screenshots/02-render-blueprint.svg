  <text x="40" y="90" fill="#D8C7A4" font-family="system-ui,sans-serif" font-size="12" letter-spacing="3">STEP 2</text>
  <text x="40" y="128" fill="#fff" font-family="system-ui,sans-serif" font-size="26" font-weight="600">Connect repo · apply render.yaml</text>
  <!-- left panel -->
  <rect x="40" y="160" width="400" height="320" rx="12" fill="#1A1A1E" stroke="#333"/>
  <text x="60" y="195" fill="#aaa" font-family="system-ui,sans-serif" font-size="13">Blueprint services detected</text>
  <rect x="60" y="220" width="360" height="56" rx="8" fill="#222" stroke="#3fb950"/>
