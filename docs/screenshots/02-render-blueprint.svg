<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect width="900" height="560" fill="#0E0E10"/>
  <rect x="0" y="0" width="900" height="52" fill="#1A1A1E"/>
  <text x="24" y="32" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="600">Render</text>
